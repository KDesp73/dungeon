<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon - Real-time Terminal Action RPG</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 12px;
            letter-spacing: 1px;
            color: #888;
        }
        #terminal-container {
            padding: 12px;
            background: #000;
            border: 1px solid #333;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
    </style>
    <!-- Include xterm.js stylesheets and scripts via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
</head>
<body>
    <h1>DUNGEON RPG</h1>
    <div id="terminal-container">
        <div id="terminal"></div>
    </div>

    <script>
        // Initialize xterm.js terminal instance
        const term = new Terminal({
            cursorBlink: true,
            rows: 24,
            cols: 80,
            theme: {
                background: '#050505',
                foreground: '#00ff66',
                cursor: '#00ff66'
            }
        });

        term.open(document.getElementById('terminal'));
        term.focus();

        // Capture keystrokes and send them to the exported C++ function `_dungeon_push_key`
        term.onData(data => {
            if (window.Module && typeof window.Module._dungeon_push_key === 'function') {
                for (let i = 0; i < data.length; i++) {
                    window.Module._dungeon_push_key(data.charCodeAt(i));
                }
            }
        });

        // Setup Emscripten Module configuration
        var Module = {
            print: (function() {
                return function(text) {
                    console.log(text);
                    term.writeln(text);
                };
            })(),
            printErr: function(text) {
                console.error(text);
                term.writeln(text);
            },
            locateFile: function(path, scriptDirectory) {
                return path;
            }
        };
    </script>

    <!-- Mandatory Emscripten script injection placeholder -->
    {{{ SCRIPT }}}
</body>
</html>
