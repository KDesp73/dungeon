<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon - Real-time Terminal Action RPG</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 12px;
            letter-spacing: 1px;
            color: #888;
        }
        #terminal-container {
            padding: 12px;
            background: #000;
            border: 1px solid #333;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 100%;
            overflow: auto;
        }
    </style>
    <!-- Include xterm.js stylesheets and scripts via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
</head>
<body>
    <h1>DUNGEON RPG</h1>
    <div id="terminal-container">
        <div id="terminal"></div>
    </div>

    <script>
        // The C++ build renders a fixed 100 x 30 character grid (see
        // src/display/term.cpp), so the xterm.js instance must match it exactly.
        const TERM_COLS = 100;
        const TERM_ROWS = 30;

        // Key kinds understood by dungeon_push_key(kind, value).
        const KEY_UP = 1;
        const KEY_DOWN = 2;
        const KEY_LEFT = 3;
        const KEY_RIGHT = 4;
        const KEY_ESCAPE = 5;

        const term = new Terminal({
            cursorBlink: true,
            rows: TERM_ROWS,
            cols: TERM_COLS,
            // The game emits '\n' between frame rows. With convertEol xterm
            // resets the column too, so rows line up instead of drifting right.
            convertEol: true,
            theme: {
                background: '#050505',
                foreground: '#ffffff',
                cursor: '#00ff66'
            }
        });

        term.open(document.getElementById('terminal'));
        term.focus();

        // Emscripten keeps any object assigned to Module and fills in the
        // runtime fields on top of it.
        var Module = {
            print: function(text) {
                console.log(text);
            },
            printErr: function(text) {
                console.error(text);
            },
            locateFile: function(path) {
                return path;
            },
            // Called from FrameBuffer::present() with one complete ANSI frame.
            dungeonWriteFrame: function(text) {
                term.write(text);
            }
        };

        function pushKey(kind, value) {
            if (typeof Module !== 'undefined' &&
                typeof Module._dungeon_push_key === 'function') {
                Module._dungeon_push_key(kind, value);
            }
        }

        // Map xterm's byte sequences to the game's logical key codes.
        term.onData(data => {
            let index = 0;

            while (index < data.length) {
                const sequence = data.slice(index, index + 3);

                if (sequence === '\x1b[A' || sequence === '\x1bOA') {
                    pushKey(KEY_UP, 0);
                    index += 3;
                    continue;
                }
                if (sequence === '\x1b[B' || sequence === '\x1bOB') {
                    pushKey(KEY_DOWN, 0);
                    index += 3;
                    continue;
                }
                if (sequence === '\x1b[C' || sequence === '\x1bOC') {
                    pushKey(KEY_RIGHT, 0);
                    index += 3;
                    continue;
                }
                if (sequence === '\x1b[D' || sequence === '\x1bOD') {
                    pushKey(KEY_LEFT, 0);
                    index += 3;
                    continue;
                }

                const character = data[index];

                if (character === '\x1b') {
                    pushKey(KEY_ESCAPE, 0);
                    index += 1;
                    continue;
                }

                const codePoint = data.codePointAt(index);
                const glyph = String.fromCodePoint(codePoint);
                pushKey(0, codePoint);
                index += glyph.length;
            }
        });

        // Give the terminal keyboard focus after the runtime has started.
        Module.onRuntimeInitialized = function() {
            term.focus();
        };
    </script>

    <!-- Mandatory Emscripten script injection placeholder -->
    {{{ SCRIPT }}}
</body>
</html>
